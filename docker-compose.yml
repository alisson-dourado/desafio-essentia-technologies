services:
  mysql:
    image: mysql:8.0
    container_name: essentia_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: essentia_tasks
      MYSQL_USER: essentia
      MYSQL_PASSWORD: essentia
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:8
    container_name: essentia_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: