<section class="tasks-page">
  <h1>Tarefas</h1>

  <button (click)="logout()">Sair</button>

  <app-task-form
    [taskToEdit]="editingTask()"
    [saving]="saving()"
    (taskCreated)="createTask($event)"
    (taskUpdated)="updateTask($event)"
    (editCancelled)="cancelEditing()"
  />

  @if (actionError()) {
    <p class="error-message">{{ actionError() }}</p>
  }

  @if (loading()) {
    <p>Carregando tarefas...</p>
  } @else if (errorMessage()) {
    <p class="error-message">{{ errorMessage() }}</p>
  } @else {
    <app-task-list
      [tasks]="tasks()"
      [processingTaskId]="processingTaskId()"
      (completionChanged)="updateCompletion($event.id, $event.completed)"
      (taskDeleted)="deleteTask($event)"
      (taskEditRequested)="startEditing($event)"
    />
  }
</section>
